name: Build Installer Binaries

on:
  push:
    branches:
      - 'dev-v4'
      - 'main'
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: Windows x64
            target: x86_64-pc-windows-msvc
            binary_name: badwords-installer.exe
            output_name: badwords-setup-windows.exe
          - os: macos-latest
            os_name: macOS Universal
            target: aarch64-apple-darwin
            binary_name: badwords-installer
            output_name: badwords-setup-macos
          - os: ubuntu-latest
            os_name: Linux x64
            target: x86_64-unknown-linux-gnu
            binary_name: badwords-installer
            output_name: badwords-setup-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libx11-dev libasound2-dev libudev-dev libfontconfig1-dev libdbus-1-dev desktop-file-utils

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Installer Binary
        run: cargo build --release --manifest-path installer/Cargo.toml

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp installer/target/release/${{ matrix.binary_name }} dist/${{ matrix.output_name }}
          else
            cp installer/target/release/${{ matrix.binary_name }} dist/${{ matrix.output_name }}
            chmod +x dist/${{ matrix.output_name }}
          fi

      - name: Upload Private Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: dist/${{ matrix.output_name }}
          retention-days: 90

      - name: Publish Public Release Asset
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.output_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
